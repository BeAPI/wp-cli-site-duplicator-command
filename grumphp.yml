grumphp:
  tasks:
    git_blacklist:
      keywords:
        - "var_dump("
      triggered_by: ['php']
      regexp_type: G
    composer:
      no_check_all: true
      no_check_publish: true
      no_local_repository: true
    phplint:
      exclude: ['vendor', 'tests/wordpress']
      triggered_by: ['php']
    phpcs:
      standard: ['phpcs.xml']
      triggered_by: ['php']
    securitychecker_composeraudit:
      run_always: false
    psalm:
      config: psalm.xml
      triggered_by: ['php']
      # Same scope as psalm.xml: the e2e scripts run through "wp eval-file".
      ignore_patterns: ['tests/', '.psalm/']
      show_info: false
